# Hand-maintained ingredient taxonomy for the stats site.
#
# Each [ingredients."<Name>"] table is one canonical ingredient: <Name> is
# what the site displays, `category` groups it for the leaderboards, and
# `aliases` lists every `ingredients_normalized` string from data/ that
# means this ingredient. Spelling variants, organic/local and tomato
# varieties all collapse here; the original wording stays visible on the
# ingredient's own page.
#
# [splits] breaks up a normalized string the site writes as two ingredients
# in one ("organic corn and baby spinach"); each part is then looked up in
# the aliases like any other.
#
# Categories: base (on nearly every pizza, left out of leaderboards and
# similarity), cheese, produce, allium, sauce, nut, herb, citrus.
#
# A new ingredient that isn't listed here shows up as "unmapped" in the
# scrape PR and on the site, and fails tests/test_stats.py — add it here.

[splits]
"organic corn and baby spinach" = ["organic corn", "organic baby spinach"]
"roasted leek and onion" = ["roasted leek", "roasted onion"]
"organic lemon and orange zest" = ["organic lemon zest", "organic orange zest"]

# --- base -----------------------------------------------------------------

[ingredients."Mozzarella"]
category = "base"
aliases = ["mozzarella"]

[ingredients."Garlic olive oil"]
category = "base"
aliases = ["garlic olive oil"]

