name: Scrape Cheese Board pizza schedule

on:
  schedule:
    # 09:00 UTC daily — adjust to whenever the site tends to update
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Scrape schedule (writes/upserts one data/<pizza-date>.json per day listed)
        run: python scrape_cheeseboard.py --data-dir data

      - name: Today's date
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Open PR with any new/changed data
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Update pizza schedule (${{ steps.date.outputs.today }})"
          title: "Pizza schedule update — ${{ steps.date.outputs.today }}"
          body: |
            Automated pizza schedule scrape for ${{ steps.date.outputs.today }}.

            Review the diff under `data/` before merging — this is also the
            place to catch scraper bugs (bad parsing, stray parentheticals,
            wrong date) before they land on `main`.
          branch: "pizza-schedule/${{ steps.date.outputs.today }}"
          delete-branch: true
          add-paths: data/
          author: "pizza-bot <pizza-bot@users.noreply.github.com>"
          committer: "pizza-bot <pizza-bot@users.noreply.github.com>"
          labels: pizza-data
