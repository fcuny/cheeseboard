name: Scrape Cheese Board pizza schedule

on:
  schedule:
    # 09:00 UTC daily — adjust to whenever the site tends to update
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - run: uv sync

      - name: Scrape schedule (writes/upserts one data/<pizza-date>.json per day listed, refreshes README table)
        run: uv run scrape_cheeseboard.py --data-dir data --readme README.md --dump-html "$RUNNER_TEMP/pizza-schedule.html"

      - name: Upload fetched page for debugging
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pizza-schedule-page
          path: ${{ runner.temp }}/pizza-schedule.html
          if-no-files-found: ignore

      - name: Today's date
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Write PR body (flags ingredients missing from ingredients.toml)
        run: |
          unmapped="$(uv run build_site.py --data-dir data --taxonomy ingredients.toml --list-unmapped)"
          {
            echo "Automated pizza schedule scrape for ${{ steps.date.outputs.today }}."
            echo
            echo "Review the diff under \`data/\` before merging — this is also the"
            echo "place to catch scraper bugs (bad parsing, stray parentheticals,"
            echo "wrong date) before they land on \`main\`."
            if [ -n "$unmapped" ]; then
              echo
              echo "### Ingredients missing from \`ingredients.toml\`"
              echo
              echo "Add these to the taxonomy (on this branch) before merging, or the"
              echo "stats site will count each as its own \"unmapped\" ingredient:"
              echo
              echo "$unmapped"
            fi
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Open PR with any new/changed data
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Update pizza schedule (${{ steps.date.outputs.today }})"
          title: "Pizza schedule update — ${{ steps.date.outputs.today }}"
          body-path: ${{ runner.temp }}/pr-body.md
          branch: "pizza-schedule/${{ steps.date.outputs.today }}"
          delete-branch: true
          add-paths: |
            data/
            README.md
          author: "pizza-bot <pizza-bot@users.noreply.github.com>"
          committer: "pizza-bot <pizza-bot@users.noreply.github.com>"
          labels: pizza-data
          assignees: fcuny
