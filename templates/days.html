{% extends "base.html" %}
{% block title %}All days — Cheese Board pizza stats{% endblock %}
{% block content %}
<h1>All days</h1>
<table>
  <thead><tr><th>Date</th><th>Pizza</th></tr></thead>
  <tbody>
  {% for d in days %}
    <tr>
      <td>{{ d.weekday }} {{ d.date }}</td>
      <td>{% if d.get("closed") %}<em>Closed</em>{% else %}<a href="{{ root }}days/{{ d.date }}.html">{{ d.ingredients | join(", ") }}</a>{% endif %}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
