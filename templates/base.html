<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Cheese Board pizza stats{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Karla:wght@400;700&display=swap">
<link rel="stylesheet" href="{{ root }}style.css">
</head>
<body>
<div class="page">
<header class="site">
  <a class="brand" href="{{ root }}index.html">Cheese Board pizza stats{% if since %} <small>collected since {{ since | day }}</small>{% endif %}</a>
  <nav>
    <a href="{{ root }}index.html">Today</a>
    <a href="{{ root }}days/index.html">All days</a>
    <a href="{{ root }}ingredients/index.html">All ingredients</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>
  <p>Built {{ today | day }} from the <a href="https://cheeseboardcollective.coop/pizza/pizza-schedule/">Cheese Board pizza schedule</a>.</p>
</footer>
</div>
</body>
</html>
